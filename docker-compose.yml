services:
  # 🛠️ Init Container: Sets up directories & permissions before app starts
  init:
    image: alpine:latest
    command: >
      sh -c " mkdir -p /data/db /data/cache/thumbnails /library/uploads /library/thumbnails /library/manga /library/audio; chmod -R 777 /data /library; echo '✅ Init complete: Created directories & set permissions (777)'; "
    volumes:
      - ./data:/data
      - ./library:/library

  fapflix:
    depends_on:
      init:
        condition: service_completed_successfully
    container_name: fapflix-v2
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/db/dev.db

      - PRISMA_CLI_BINARY_TARGETS=linux-arm64-openssl-3.0.x
    volumes:
      # 💾 Database Persistence
      # (Host path : Container path)
      - ./data/db:/app/db

      # 📁 Media Library (Videos, Manga, Audio)
      # CHANGE THIS to your actual media path on the Raspberry Pi / Host
      # Example: - /mnt/hdd/Adult:/app/library
      - ./library:/app/library

      # 🖼️ Thumbnail Cache (Optional but recommended)
      - ./data/cache:/app/.cache
    # 🔧 Resource Limits (Optional for Pi 3/4)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G

volumes:
  # Named volumes if you prefer managed volumes over bind mounts
  db_data:
